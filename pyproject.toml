[project]
name = "grafonet-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "apispec>=6.10.0",
    "apispec-webframeworks>=1.2.0",
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "flask-swagger-ui>=5.34.0",
    "pillow>=13.0.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src", "."]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
select = ["F", "I"]
