[project]
name = "grafonet-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask>=3.1.3",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
